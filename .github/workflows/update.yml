name: Seite aktualisieren

on:
  schedule:
    - cron: "0 4 * * 1"   # montags 04:00 UTC = 06:00 Sommerzeit / 05:00 Winterzeit
  workflow_dispatch:
    inputs:
      neu_suchen:
        description: "Mannschaften neu suchen (z. B. zu Saisonbeginn)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [update.py, template.html, .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ergebnisse holen und Seite bauen
        run: python update.py ${{ (github.event_name == 'schedule' || inputs.neu_suchen) && '--neu' || '' }}

      - name: Cache speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache.json teams.json
          git diff --cached --quiet || git commit -m "Cache aktualisiert"
          git push

      - name: Seite zusammenstellen
        run: mkdir _site && cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
